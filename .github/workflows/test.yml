# Simplified Test Suite - SQLite In-Memory (No External Dependencies)
name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Backend Tests (SQLite In-Memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Push Prisma schema to in-memory database
        working-directory: backend
        run: bunx prisma db push --accept-data-loss

      - name: Run backend tests
        run: bun --filter backend test
        env:
          NODE_ENV: test

  test-frontend:
    name: Frontend Tests (JSDOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run frontend tests
        run: bun --filter frontend test
        env:
          NODE_ENV: test

  typecheck:
    name: TypeScript Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: |
          bun --filter backend run typecheck
          bun --filter frontend run typecheck