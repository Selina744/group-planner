version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: ["node", "dist/index.js"]
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    restart: unless-stopped
    mem_limit: 2000m
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    command: ["bun", "run", "--filter", "@group-planner/frontend", "--", "preview", "--host", "0.0.0.0", "--port", "3001"]
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    restart: unless-stopped
    mem_limit: 2000m
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    mem_limit: 600m
    networks:
      - production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 2000m
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: ${POSTGRES_DB:-groupplanner}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-groupplanner} -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - production

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 600m
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - redis_prod:/data
    networks:
      - production

volumes:
  pgdata_prod:
  redis_prod:

networks:
  production:
    driver: bridge
